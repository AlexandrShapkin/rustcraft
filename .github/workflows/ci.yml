name: ci

on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify reviewed governance sources
        run: python -B scripts/test_governance_sources.py
      - name: Documentation tool tests
        run: python -m unittest discover -s scripts/tests -p "test_docs.py"
      - name: Workspace status tests
        run: python -m unittest discover -s scripts/tests -p "test_workspace.py"
      - name: F1 field wrapper tests
        run: python -m unittest discover -s scripts/tests -p "test_f1_client.py"
      - name: Documentation integrity (offline)
        run: python scripts/docs.py check
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Check
        run: cargo check --workspace --all-targets
      - name: Test
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
